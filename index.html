<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>TBULD — Tampa Bay Uber Lyft Drivers</title>
<link rel="apple-touch-icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Manrope', system-ui, sans-serif; background: #1B1440; }
  textarea, input { font-family: 'Manrope', system-ui, sans-serif; }
  ::placeholder { color: rgba(255,246,236,0.4); }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect } = React;

const TOKENS = {
  bgDeep: "#1B1440",
  bgDeep2: "#3A1A4E",
  sunOrange: "#FF7A1A",
  sunRed: "#FF3D3D",
  pink: "#EC1E7A",
  pinkLight: "#FFC1DE",
  amber: "#FFB800",
  cream: "#FFF6EC",
};
const SUNSET_BG = `linear-gradient(180deg, ${TOKENS.bgDeep} 0%, ${TOKENS.bgDeep2} 32%, ${TOKENS.sunRed} 68%, ${TOKENS.sunOrange} 100%)`;

const STORAGE_KEY = "tbuld_app_data_v1";

const DEFAULT_DATA = {
  events: [
    { id: "e1", posted: "This week",
      body: "Reggae Rise Up Fest — Raymond James Stadium lot, Fri–Sun nights\nTampa Bay Lightning vs Panthers — Amalie Arena, Thu 7pm\nOrlando Magic home game — Kia Center, Sat 7:30pm\nMatt Rife comedy — Yuengling Center, Fri 8pm" }
  ],
  traffic: { updated: "Today",
    body: "I-4 westbound construction near Dale Mabry, expect delays 3–7pm.\nGandy Bridge slow both directions during Lightning game traffic.\nAvoid Selmon Expressway exit 3 after 9pm Fri/Sat — event backup." },
  whereToWork: { updated: "Today",
    body: "Downtown Tampa: strong after 6pm, event traffic tonight.\nIVE / Ybor: good weekend late-night pickups.\nOrlando I-Drive: steady all day, airport runs pay well before noon." },
  buzz: [
    { id: "b1", tag: "PLATFORM MOVE", headline: "Lyft hands drivers more control over their app",
      body: "Lyft is rolling back its black-box dispatch system, letting drivers pick trip types, stack incentives, and manage their own territory instead of just taking whatever the algorithm sends.",
      source: "The Rideshare Guy" },
    { id: "b2", tag: "MONEY", headline: "Drivers cashing in on a $328M back-pay settlement",
      body: "Uber and Lyft settled with regulators after years of shorting driver pay — checks are going out to eligible drivers now.",
      source: "CBS News" },
    { id: "b3", tag: "ROBOTAXI WATCH", headline: "Driverless cars are creeping into more cities",
      body: "Uber and Lyft are both quietly building robotaxi partnerships, testing autonomous rides in select markets while still relying on human drivers everywhere else — for now.",
      source: "NewsNation" },
    { id: "b4", tag: "TAX SEASON", headline: "New tip deduction could put real money back in your pocket",
      body: "A new federal deduction lets self-employed drivers write off up to $25,000 a year in reported tips — worth checking with your tax person before filing.",
      source: "Jackson Hewitt" }
  ],
  drivers: [{ id: "d1", name: "Marcus D.", phone: "813-555-0110", status: "pending" }],
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : DEFAULT_DATA;
  } catch { return DEFAULT_DATA; }
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

function Icon({ children, size=20 }) {
  return <span style={{fontSize:size, lineHeight:1, display:"inline-block"}}>{children}</span>;
}

function ConvoyStrip({ count=9 }) {
  const colors = [TOKENS.sunOrange, TOKENS.pink, TOKENS.amber];
  return (
    <div style={{display:"flex",gap:6,opacity:0.9}}>
      {Array.from({length:count}).map((_,i)=>(
        <span key={i} style={{color:colors[i%3], fontSize:12}}>🚗</span>
      ))}
    </div>
  );
}

function Wordmark({ size="32px" }) {
  return (
    <div>
      <div style={{fontSize:size, fontWeight:800, letterSpacing:"-0.01em", color:TOKENS.cream, textTransform:"uppercase", lineHeight:1}}>
        TBULD
      </div>
      <div style={{fontSize:10, letterSpacing:"0.2em", textTransform:"uppercase", marginTop:4, fontWeight:700, color:TOKENS.pinkLight}}>
        Tampa Bay · Uber &amp; Lyft Drivers
      </div>
    </div>
  );
}

function PrimaryButton({ children, onClick, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      style={{
        width:"100%", padding:"14px", borderRadius:12, fontWeight:800, fontSize:16,
        border:"none", color:TOKENS.cream,
        background: disabled ? "#4a3a5c" : `linear-gradient(135deg, ${TOKENS.sunOrange}, ${TOKENS.pink})`,
        boxShadow: disabled ? "none" : `0 6px 20px -6px ${TOKENS.sunRed}99`,
        opacity: disabled ? 0.4 : 1,
      }}>
      {children}
    </button>
  );
}

function Screen({ children }) {
  return (
    <div style={{width:"100%", minHeight:"100vh", display:"flex", flexDirection:"column", background:SUNSET_BG}}>
      {children}
    </div>
  );
}

function TopBar({ title, onBack, right }) {
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"24px 20px 16px"}}>
      <button onClick={onBack} style={{width:36,height:36,borderRadius:999,border:"none",background:"rgba(255,255,255,0.08)",color:TOKENS.cream,fontSize:18}}>‹</button>
      <div style={{fontWeight:800,fontSize:13,textTransform:"uppercase",letterSpacing:"0.05em",color:TOKENS.pinkLight}}>{title}</div>
      <div style={{width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center"}}>{right}</div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(loadData());
  const [route, setRoute] = useState("welcome");
  const [role, setRole] = useState(null);
  const [me, setMe] = useState(null);
  const [signupName, setSignupName] = useState("");
  const [signupPhone, setSignupPhone] = useState("");
  const [draft, setDraft] = useState({ events:"", traffic:"", whereToWork:"", buzz:"" });

  useEffect(() => { saveData(data); }, [data]);

  const update = (next) => setData(next);
  const approvedDrivers = data.drivers.filter(d => d.status === "approved");
  const pendingDrivers = data.drivers.filter(d => d.status === "pending");

  const cardStyle = { background:"rgba(255,255,255,0.06)", borderRadius:12, border:"1px solid rgba(255,255,255,0.08)" };
  const inputStyle = { width:"100%", padding:"14px 16px", borderRadius:12, border:"none", outline:"none", fontSize:14, fontWeight:600, background:"rgba(255,255,255,0.08)", color:TOKENS.cream };

  if (route === "welcome") {
    return (
      <Screen>
        <div style={{flex:1, display:"flex", flexDirection:"column", justifyContent:"space-between", padding:"40px 24px"}}>
          <div />
          <div>
            <Wordmark />
            <p style={{marginTop:24, fontSize:18, lineHeight:1.4, fontWeight:600, color:TOKENS.cream}}>
              "We don't just drive the miles. We drive the last one — the one that makes sure somebody gets home safe."
            </p>
            <p style={{marginTop:12, fontSize:12, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:TOKENS.amber}}>
              One Community. One Mission. One Movement.
            </p>
            <div style={{marginTop:16}}><ConvoyStrip /></div>
          </div>
          <div style={{display:"flex", flexDirection:"column", gap:12}}>
            <PrimaryButton onClick={() => setRoute("signup")}>I'm a driver — join TBULD</PrimaryButton>
            <button onClick={() => setRoute("adminLogin")} style={{background:"none",border:"none",fontSize:12,fontWeight:700,color:"rgba(255,246,236,0.55)",padding:"8px"}}>
              🔒 Admin access
            </button>
          </div>
        </div>
      </Screen>
    );
  }

  if (route === "signup") {
    return (
      <Screen>
        <TopBar title="Join TBULD" onBack={() => setRoute("welcome")} />
        <div style={{flex:1,padding:"8px 24px 24px",display:"flex",flexDirection:"column",gap:16}}>
          <p style={{fontSize:14,color:"rgba(255,246,236,0.7)"}}>TBULD community pros review every request — keeps this to real drivers only.</p>
          <input placeholder="Your name" value={signupName} onChange={e=>setSignupName(e.target.value)} style={inputStyle} />
          <input placeholder="Phone or email" value={signupPhone} onChange={e=>setSignupPhone(e.target.value)} style={inputStyle} />
          <PrimaryButton disabled={!signupName.trim() || !signupPhone.trim()} onClick={() => {
            const id = "d" + Date.now();
            update({ ...data, drivers: [...data.drivers, { id, name: signupName.trim(), phone: signupPhone.trim(), status: "pending" }] });
            setMe(id); setRoute("pending");
          }}>Request access</PrimaryButton>
        </div>
      </Screen>
    );
  }

  if (route === "pending") {
    const myRecord = data.drivers.find(d => d.id === me);
    const approved = myRecord?.status === "approved";
    return (
      <Screen>
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 32px",textAlign:"center",gap:16}}>
          <div style={{width:64,height:64,borderRadius:999,display:"flex",alignItems:"center",justifyContent:"center",background: approved ? TOKENS.pink : "rgba(255,255,255,0.08)",fontSize:28}}>
            {approved ? "✅" : "⏰"}
          </div>
          <div style={{fontWeight:800,fontSize:20,color:TOKENS.cream}}>{approved ? "You're in" : "Pending approval"}</div>
          <p style={{fontSize:14,color:"rgba(255,246,236,0.65)"}}>
            {approved ? "Welcome to TBULD — here's your hub." : "TBULD community pros are reviewing your request. Check back shortly."}
          </p>
          {approved && <PrimaryButton onClick={() => { setRole("driver"); setRoute("hub"); }}>Enter TBULD</PrimaryButton>}
        </div>
      </Screen>
    );
  }

  if (route === "adminLogin") {
    return (
      <Screen>
        <TopBar title="Admin" onBack={() => setRoute("welcome")} />
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 32px",gap:16,textAlign:"center"}}>
          <div style={{fontSize:32}}>🛡️</div>
          <p style={{fontSize:14,color:"rgba(255,246,236,0.7)"}}>Demo mode — real version will require your login.</p>
          <PrimaryButton onClick={() => { setRole("admin"); setRoute("hub"); }}>Enter as admin</PrimaryButton>
        </div>
      </Screen>
    );
  }

  if (route === "hub") {
    const tiles = [
      { key:"events", label:"Events", icon:"📅", sub:"This week's lineup, plus the archive" },
      { key:"traffic", label:"Traffic", icon:"🧭", sub:"Live map + Sabrina's road notes" },
      { key:"work", label:"Where to Work", icon:"📍", sub:"Best zones right now" },
      { key:"buzz", label:"The Buzz", icon:"🔥", sub:"Industry news — good airport-line reading" },
    ];
    return (
      <Screen>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"24px 24px 8px"}}>
          <Wordmark size="22px" />
          <button onClick={() => { setRoute("welcome"); setRole(null); setMe(null); }}
            style={{width:36,height:36,borderRadius:999,border:"none",background:"rgba(255,255,255,0.08)",fontSize:16}}>🚪</button>
        </div>
        <div style={{padding:"16px 24px 0",display:"flex",flexDirection:"column",gap:12,flex:1}}>
          {tiles.map(t => (
            <button key={t.key} onClick={() => setRoute(t.key)}
              style={{...cardStyle, display:"flex",alignItems:"center",gap:16,padding:20,textAlign:"left",cursor:"pointer"}}>
              <div style={{width:48,height:48,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,
                background:`linear-gradient(135deg, ${TOKENS.sunOrange}, ${TOKENS.pink})`}}>{t.icon}</div>
              <div>
                <div style={{fontWeight:800,fontSize:16,color:TOKENS.cream}}>{t.label}</div>
                <div style={{fontSize:12,color:"rgba(255,246,236,0.55)"}}>{t.sub}</div>
              </div>
            </button>
          ))}
          {role === "admin" && (
            <button onClick={() => setRoute("adminPanel")}
              style={{display:"flex",alignItems:"center",gap:16,padding:20,textAlign:"left",borderRadius:12,marginTop:4,
                background:"rgba(255,184,0,0.1)",border:`1px solid ${TOKENS.amber}44`}}>
              <div style={{width:48,height:48,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,background:TOKENS.amber}}>👥</div>
              <div>
                <div style={{fontWeight:800,fontSize:16,color:TOKENS.cream}}>Admin panel</div>
                <div style={{fontSize:12,color:"rgba(255,246,236,0.55)"}}>{pendingDrivers.length} pending · post updates</div>
              </div>
            </button>
          )}
        </div>
        <div style={{padding:"8px 24px 32px",display:"flex",justifyContent:"center"}}><ConvoyStrip count={11} /></div>
      </Screen>
    );
  }

  if (route === "events") {
    return (
      <Screen>
        <TopBar title="Events" onBack={() => setRoute("hub")} right="📅" />
        <div style={{flex:1,padding:"0 24px 32px",display:"flex",flexDirection:"column",gap:12,overflowY:"auto"}}>
          {data.events.map(e => (
            <div key={e.id} style={{...cardStyle,padding:16}}>
              <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8,color:TOKENS.amber}}>{e.posted}</div>
              <div style={{fontSize:14,lineHeight:1.6,whiteSpace:"pre-line",color:TOKENS.cream}}>{e.body}</div>
            </div>
          ))}
        </div>
      </Screen>
    );
  }

  if (route === "traffic") {
    return (
      <Screen>
        <TopBar title="Traffic" onBack={() => setRoute("hub")} right="🧭" />
        <div style={{flex:1,padding:"0 24px 32px",display:"flex",flexDirection:"column",gap:16}}>
          <div style={{width:"100%",height:144,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,0.05)",border:"1px dashed rgba(255,255,255,0.15)",color:"rgba(255,246,236,0.4)",fontSize:12}}>
            Live map embed goes here
          </div>
          <div style={{...cardStyle,padding:16}}>
            <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8,color:TOKENS.amber}}>Sabrina's notes · {data.traffic.updated}</div>
            <div style={{fontSize:14,lineHeight:1.6,whiteSpace:"pre-line",color:TOKENS.cream}}>{data.traffic.body}</div>
          </div>
        </div>
      </Screen>
    );
  }

  if (route === "work") {
    return (
      <Screen>
        <TopBar title="Where to Work" onBack={() => setRoute("hub")} right="📍" />
        <div style={{flex:1,padding:"0 24px 32px"}}>
          <div style={{...cardStyle,padding:16}}>
            <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8,color:TOKENS.amber}}>Today's picks · {data.whereToWork.updated}</div>
            <div style={{fontSize:14,lineHeight:1.6,whiteSpace:"pre-line",color:TOKENS.cream}}>{data.whereToWork.body}</div>
          </div>
        </div>
      </Screen>
    );
  }

  if (route === "buzz") {
    return (
      <Screen>
        <TopBar title="The Buzz" onBack={() => setRoute("hub")} right="🔥" />
        <div style={{flex:1,padding:"0 24px 32px",display:"flex",flexDirection:"column",gap:12,overflowY:"auto"}}>
          <p style={{fontSize:12,color:"rgba(255,246,236,0.55)",marginBottom:4}}>Rideshare industry news, curated for TBULD. Something to read while you wait.</p>
          {data.buzz.map(b => (
            <div key={b.id} style={{padding:16,borderRadius:12,background:"rgba(0,0,0,0.22)",borderLeft:`3px solid ${TOKENS.amber}`}}>
              <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6,color:TOKENS.amber}}>{b.tag}</div>
              <div style={{fontSize:16,fontWeight:800,lineHeight:1.3,marginBottom:6,color:TOKENS.cream}}>{b.headline}</div>
              <div style={{fontSize:14,lineHeight:1.6,marginBottom:8,color:"rgba(255,246,236,0.82)"}}>{b.body}</div>
              <div style={{fontSize:11,fontWeight:700,color:TOKENS.pinkLight}}>— {b.source}</div>
            </div>
          ))}
        </div>
      </Screen>
    );
  }

  if (route === "adminPanel") {
    const post = (field) => {
      if (!draft[field].trim()) return;
      const next = { ...data };
      if (field === "events") {
        next.events = [{ id:"e"+Date.now(), posted:"This week", body:draft.events.trim() }, ...next.events];
      } else if (field === "buzz") {
        next.buzz = [{ id:"b"+Date.now(), tag:"TBULD PICK", headline:draft.buzz.trim().split("\n")[0], body:draft.buzz.trim(), source:"Sabrina" }, ...next.buzz];
      } else {
        next[field] = { updated:"Just now", body:draft[field].trim() };
      }
      update(next);
      setDraft({ ...draft, [field]: "" });
    };
    const setStatus = (id, status) => {
      update({ ...data, drivers: data.drivers.map(d => d.id === id ? { ...d, status } : d) });
    };
    const fields = [
      { key:"events", label:"Post this week's events", placeholder:"Paste your Thursday events post here…" },
      { key:"traffic", label:"Update traffic notes", placeholder:"Construction, detours, event backups…" },
      { key:"whereToWork", label:"Update where-to-work picks", placeholder:"Best zones right now…" },
      { key:"buzz", label:"Post a Buzz story", placeholder:"Drop the story or a link + quick summary…" },
    ];
    return (
      <Screen>
        <TopBar title="Admin panel" onBack={() => setRoute("hub")} right="👥" />
        <div style={{flex:1,padding:"0 24px 40px",overflowY:"auto",display:"flex",flexDirection:"column",gap:24}}>
          <div>
            <div style={{fontSize:12,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8,color:TOKENS.pinkLight}}>Pending drivers ({pendingDrivers.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {pendingDrivers.length === 0 && <div style={{fontSize:12,color:"rgba(255,246,236,0.4)"}}>No one waiting right now.</div>}
              {pendingDrivers.map(d => (
                <div key={d.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:12,borderRadius:12,background:"rgba(255,255,255,0.06)"}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:TOKENS.cream}}>{d.name}</div>
                    <div style={{fontSize:12,color:"rgba(255,246,236,0.5)"}}>{d.phone}</div>
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={() => setStatus(d.id,"approved")} style={{width:32,height:32,borderRadius:999,border:"none",background:TOKENS.pink,color:TOKENS.cream}}>✓</button>
                    <button onClick={() => setStatus(d.id,"denied")} style={{width:32,height:32,borderRadius:999,border:"none",background:"rgba(255,255,255,0.1)",color:TOKENS.pinkLight}}>✕</button>
                  </div>
                </div>
              ))}
            </div>
            <div style={{fontSize:12,marginTop:8,color:"rgba(255,246,236,0.4)"}}>{approvedDrivers.length} approved driver{approvedDrivers.length===1?"":"s"}</div>
          </div>
          {fields.map(f => (
            <div key={f.key}>
              <div style={{fontSize:12,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8,color:TOKENS.pinkLight}}>{f.label}</div>
              <textarea value={draft[f.key]} onChange={e=>setDraft({...draft,[f.key]:e.target.value})} placeholder={f.placeholder} rows={3}
                style={{width:"100%",padding:"12px 16px",borderRadius:12,border:"none",outline:"none",fontSize:14,resize:"none",background:"rgba(255,255,255,0.08)",color:TOKENS.cream}} />
              <button onClick={() => post(f.key)} style={{marginTop:8,display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:800,padding:"8px 16px",borderRadius:8,border:"none",background:TOKENS.pink,color:TOKENS.cream}}>
                📤 Post &amp; notify drivers
              </button>
            </div>
          ))}
        </div>
      </Screen>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
